events {
    worker_connections 2048;
}

http {
    upstream flashtix_backend {
        least_conn;
        server app-1:8080 max_fails=2 fail_timeout=5s;
        server app-2:8080 max_fails=2 fail_timeout=5s;
        server app-3:8080 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://flashtix_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Automatic failover: immediately retry on surviving upstream nodes, including POST (protected by Idempotency-Key)
            proxy_next_upstream error timeout http_502 http_503 non_idempotent;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;

            # Timeouts
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
        }
    }
}
